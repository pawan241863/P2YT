name: PSQUARE NEW YOUTUBE APK

on:
  push:
    branches: [ "master" ]
    paths:
      - ".github/workflows/PSQUARE-NEW-YOUTUBE.yml"
      - "smarttubetv/**"
      - "common/**"
      - "leanbackassistant/**"
      - "exoplayer-library-sabr/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-psquare:
    name: Build PSQUARE NEW YOUTUBE
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}

    steps:
      - name: Checkout complete source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure optional release signing
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "storeFile=${{ github.workspace }}/key.jks" >> keystore.properties
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > ${{ github.workspace }}/key.jks

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Run release lint
        run: ./gradlew lintStbetaRelease

      - name: Build all release APK variants
        run: ./gradlew clean assembleStbetaRelease

      - name: Prepare named universal APK
        shell: bash
        run: |
          set -euo pipefail
          source_apk=$(find smarttubetv/build/outputs/apk/stbeta/release -maxdepth 1 -type f -name '*_universal.apk' -print -quit)
          if [ -z "$source_apk" ]; then
            echo "Universal APK was not produced by Gradle."
            find smarttubetv/build/outputs/apk/stbeta/release -maxdepth 1 -type f -print
            exit 1
          fi
          mkdir -p dist
          cp "$source_apk" "dist/PSQUARE NEW YOUTUBE.apk"
          sha256sum "dist/PSQUARE NEW YOUTUBE.apk" | tee dist/SHA256SUMS.txt

      - name: Upload PSQUARE NEW YOUTUBE APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PSQUARE NEW YOUTUBE
          path: |
            dist/PSQUARE NEW YOUTUBE.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
