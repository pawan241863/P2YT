# Installable debug-signed universal APK for Psquare YT Android TV.
name: PSQUARE NEW YOUTUBE APK

on:
  push:
    branches: [ "master" ]
    paths:
      - ".github/workflows/PSQUARE-NEW-YOUTUBE.yml"
      - "smarttubetv/**"
      - "common/**"
      - "leanbackassistant/**"
      - "exoplayer-library-sabr/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-psquare:
    name: Build installable PSQUARE NEW YOUTUBE universal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      # Debug variant is automatically signed with Android's debug key,
      # so installation does not depend on repository signing secrets.
      - name: Build signed universal APK
        run: ./gradlew clean assembleStbetaDebug

      - name: Prepare named universal APK
        shell: bash
        run: |
          set -euo pipefail
          source_apk=$(find smarttubetv/build/outputs/apk/stbeta/debug -maxdepth 1 -type f -name '*_universal.apk' -print -quit)
          if [ -z "$source_apk" ]; then
            echo "Universal debug APK was not produced by Gradle."
            find smarttubetv/build/outputs/apk/stbeta/debug -maxdepth 1 -type f -print
            exit 1
          fi
          mkdir -p dist
          cp "$source_apk" "dist/PSQUARE NEW YOUTUBE-universal-signed.apk"
          sha256sum "dist/PSQUARE NEW YOUTUBE-universal-signed.apk" | tee dist/SHA256SUMS.txt

      - name: Upload signed PSQUARE NEW YOUTUBE APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PSQUARE NEW YOUTUBE - INSTALLABLE UNIVERSAL
          path: |
            dist/PSQUARE NEW YOUTUBE-universal-signed.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
